<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores de Hogar - Menú Digital</title>
    
    <!-- FUENTES ESTILO GÓTICO ELEGANTE Y LEGIBLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    
    <!-- Librería de Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- ENLACE DIRECTO AL CSS -->
    <link rel="stylesheet" href="./estilo.css">
</head>
<body>

    <!-- PERSONAJE 1: EL PATITO CHEF -->
    <div id="patito-guia" class="patito">
        <div class="bocadillo" id="bocadillo-pato">¡Hola! 👋</div>
        <div class="pato-cuerpo-completo">
            <div class="sombrero-chef"></div>
            <div class="pato-cabeza-cuello">
                <div class="pato-cabeza">
                    <div class="pato-ojo"></div>
                    <div class="pato-pico"></div>
                </div>
            </div>
            <div class="pato-ala"></div>
            <div class="pato-tronco"></div>
            <div class="pato-patas">
                <div class="pata pata-izq"></div>
                <div class="pata pata-der"></div>
            </div>
        </div>
    </div>

    <!-- PERSONAJE 2: EL POLLO RIVAL (NINJA) -->
    <div id="pollo-rival" class="pollo">
        <div class="bocadillo-pollo" id="bocadillo-pollito">¡El menú es mío! 🥷</div>
        <div class="pollo-cuerpo-completo">
            <div class="cresta-pollo"></div>
            <div class="pollo-cabeza">
                <div class="pato-ojo"></div>
                <div class="pico-pollo"></div>
            </div>
            <div class="bandana-ninja"></div>
            <div class="pollo-tronco"></div>
            <div class="pollo-ala"></div>
            <div class="pollo-patas">
                <div class="pata-p pata-izq"></div>
                <div class="pata-p pata-der"></div>
            </div>
        </div>
    </div>

    <div class="marco">
        <!-- LOGO / HEADER -->
        <header class="header">
            <img src="logo.jpeg" alt="Logo Sabores de Hogar" class="logo">
            <h1 class="texto-ladrillo">Sabores de Hogar</h1>
            <p class="slogan-calido">El sabor que reúne a la familia</p>
        </header>

        <!-- CONTENEDOR PRINCIPAL RESPONSIVO -->
        <div class="main-container">
            
            <!-- SECCIÓN DEL MENÚ -->
            <main class="left-menu">
                <h2 class="titulo-seccion">🐷 Especiales de Chancho y Pollo</h2>
                <div class="grid-platos">
                    <div class="plato-card" id="card-chicharron-chancho">
                        <img src="1.png" alt="Chicharrón de Chancho">
                        <div class="plato-info">
                            <span class="plato-name">Chicharrón de Chancho</span>
                            <button class="btn-agregar" onclick="add('Chicharrón de Chancho', 'card-chicharron-chancho')"><i class="ri-add-circle-fill"></i></button>
                        </div>
                    </div>
                    <div class="plato-card" id="card-chicharron-pollo">
                        <img src="2.png" alt="Chicharrón de Pollo">
                        <div class="plato-info">
                            <span class="plato-name">Chicharrón de Pollo</span>
                            <button class="btn-agregar" onclick="add('Chicharrón de Pollo', 'card-chicharron-pollo')"><i class="ri-add-circle-fill"></i></button>
                        </div>
                    </div>
                    <div class="plato-card" id="card-lechon-chancho">
                        <img src="3.png" alt="Lechón de Chancho">
                        <div class="plato-info">
                            <span class="plato-name">Lechón de Chancho</span>
                            <button class="btn-agregar" onclick="add('Lechón de Chancho', 'card-lechon-chancho')"><i class="ri-add-circle-fill"></i></button>
                        </div>
                    </div>
                    <div class="plato-card" id="card-lechon-pollo">
                        <img src="4.png" alt="Lechón de Pollo">
                        <div class="plato-info">
                            <span class="plato-name">Lechón de Pollo</span>
                            <button class="btn-agregar" onclick="add('Lechón de Pollo', 'card-lechon-pollo')"><i class="ri-add-circle-fill"></i></button>
                        </div>
                    </div>
                </div>

                <h2 class="titulo-seccion">🌵 Especiales Tradicionales</h2>
                <div class="grid-platos">
                    <div class="plato-card" id="card-chicharron-llama">
                        <img src="2.png" alt="Chicharrón de Llama">
                        <div class="plato-info">
                            <span class="plato-name">Chicharrón de Llama</span>
                            <button class="btn-agregar" onclick="add('Chicharrón de Llama', 'card-chicharron-llama')"><i class="ri-add-circle-fill"></i></button>
                        </div>
                    </div>
                </div>
            </main>

            <!-- SECCIÓN LATERAL: CARRITO -->
            <aside class="carrito-sidebar borde-suave">
                <h3 class="carrito-titulo">🛒 Tu Pedido</h3>
                <ul id="lista" class="lista-carrito"></ul>
                
                <div class="input-contenedor-rustico">
                    <label class="label-rustico"><i class="ri-map-pin-2-fill"></i> Dirección:</label>
                    <input type="text" id="direccion-envio" placeholder="Ej: Av. Ballivián #123">
                </div>

                <div class="qr-pago-box">
                    <h4>💳 Realiza tu Pago</h4>
                    <img src="qr-pago.jpeg" alt="QR" class="img-qr-rustica">
                </div>

                <button class="btn-rustico-verde" onclick="enviarPedido()"><i class="ri-whatsapp-line"></i> Enviar Pedido</button>
            </aside>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
